<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#111111; --muted:#666666; --line:#e5e5e5; --soft:#f3f3f3; --focus:#1f3a5f;
  --d0:#7a5c99; --d1:#2f6fa3; --d2:#b9772f; --d3:#b5455a; --d4:#2a8a7e; --d5:#7f8a2f; --d6:#6f7c89;
  --serif:'Inter','Noto Sans JP',system-ui,-apple-system,sans-serif; --sans:'Inter','Noto Sans JP',system-ui,-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:0}
header.top{padding:18px 22px 12px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:end;border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em}
header.top .sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{padding:7px 14px;border-radius:0;border:1px solid var(--line);font-weight:500;font-size:14px;background:var(--bg)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.controls input[type=search]{flex:1 1 240px;max-width:380px;padding:8px 12px;border:1px solid var(--line);border-radius:0;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:0;border:1px solid var(--line);font-size:13px;background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:0;align-items:start}
.rail{border-right:1px solid var(--line);padding:14px 10px 24px 16px;position:sticky;top:0;max-height:100vh;overflow:auto;background:var(--panel)}
.rail h3{font-family:var(--serif);font-size:15px;margin:14px 0 4px;font-weight:600}
.rail h3 .dm{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.rail .row{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;padding:4px 8px;border-radius:0;font-size:13.5px;align-items:center;position:relative}
.rail .row:hover{background:var(--soft)}
.rail .row[aria-current="true"]{background:var(--soft);font-weight:600}
.rail .row .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.stage{padding:14px 16px 24px;min-width:0}
.stage svg{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:0}
.stage svg text{font-family:var(--sans);fill:var(--ink)}
.halo{paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 2px 0;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.hint{margin:8px 2px 0;color:var(--muted);font-size:13px}
.panel{border-left:1px solid var(--line);background:var(--panel);padding:20px 22px 30px;position:sticky;top:0;max-height:100vh;overflow:auto;min-height:60vh}
.panel h2{font-family:var(--serif);font-size:23px;line-height:1.2;margin:0 0 6px;font-weight:600}
.panel h4{font-size:13.5px;margin:20px 0 6px;font-weight:600}
.panel p{margin:6px 0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.tag i{width:9px;height:9px;border-radius:50%;display:inline-block}
.muted{color:var(--muted)}
.kw{display:flex;flex-wrap:wrap;gap:6px}
.kw span{font-size:12.5px;padding:3px 9px;border-radius:0;background:var(--soft)}
.kw span b{font-weight:500;color:var(--muted);margin-left:5px}
.per{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.per div{font-size:12.5px;color:var(--muted)}
.per .bar{height:44px;background:var(--soft);border-radius:0;position:relative;margin-bottom:4px}
.per .bar i{position:absolute;left:0;right:0;bottom:0;border-radius:0;display:block}
.per b{display:block;color:var(--ink);font-weight:600;font-size:13.5px}
.link{display:block;width:100%;padding:8px 0;border-top:1px solid var(--line)}
.link:first-of-type{border-top:0}
.link .top{display:flex;justify-content:space-between;gap:10px;font-weight:500}
.link .meter{height:4px;border-radius:0;background:var(--soft);margin:5px 0 4px;overflow:hidden}
.link .meter i{display:block;height:100%;background:var(--ink);opacity:.55}
.link .ev{font-size:12.5px;color:var(--muted)}
.ex{display:block;font-size:13px;margin-top:3px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.alist{list-style:none;margin:0;padding:0}
.alist li{border-top:1px solid var(--line)}
.alist li:first-child{border-top:0}
.alist button{display:block;width:100%;padding:8px 0}
.alist .t{font-family:var(--serif);font-size:15px;line-height:1.3}
.alist .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.doi{font-size:13px}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
.sub-chip{display:inline-block;margin:2px 6px 2px 0;padding:3px 10px;border-radius:0;border:1px solid currentColor;font-size:12.5px}
.sub-chip.main{color:var(--panel)!important}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:10px 0}
details{margin-top:14px;font-size:13.5px}
details summary{cursor:pointer;font-weight:600}
details p{color:var(--muted)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--panel);padding:6px 9px;border-radius:0;font-size:12.5px;max-width:300px;z-index:5;display:none;line-height:1.35}
.heat{width:100%;border-collapse:separate;border-spacing:0 2px;font-size:13.5px}
.heat th{font-weight:500;color:var(--muted);text-align:right;padding:2px 8px;font-size:12.5px}
.heat th:first-child{text-align:left}
.heat td{padding:0}
.heat td.l button{width:100%;padding:5px 8px;display:flex;align-items:center;gap:8px}
.heat td.l i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.heat td.c{text-align:right;padding:5px 8px;font-variant-numeric:tabular-nums;border-radius:0}
.heat tr.sel td.l button{font-weight:600}
.stack{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;align-items:center;margin:4px 0 16px;font-size:13px}
.stack .bar{display:flex;height:22px;border-radius:0;overflow:hidden}
.stack .bar i{display:block;height:100%}
.stagebox{background:var(--panel);border:1px solid var(--line);border-radius:0;padding:16px 18px}
.stagebox h3{font-family:var(--serif);font-size:18px;margin:0 0 4px}
@media (max-width:1180px){
  .layout{grid-template-columns:minmax(0,1fr) 380px}
  .rail{display:none}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none;border-left:0;border-top:1px solid var(--line)}
  header.top h1{font-size:23px}
  .tabs{margin-left:0}
}
@media (prefers-reduced-motion:no-preference){
  .node{transition:opacity .15s}
}

  h += '<h4>Subjects</h4><div><button class="sub-chip main" data-s="'+a.s+'" style="background:'+dcol(s.dom)+';color:#fff;border-color:'+dcol(s.dom)+'">'+esc(s.label)+'</button>';
  a.x.forEach(x => { h += '<button class="sub-chip" data-s="'+x+'" style="color:'+dcol(S[x].dom)+'">'+esc(S[x].label)+'</button>'; });
  h += '</div><p class="note">'+(a.m?'This article\u2019s main subject was placed by hand.':'Main subject assigned automatically from title, keywords and abstract.')+'</p>';
  if(a.k.length) h += '<h4>Keywords</h4><div class="kw">'+a.k.map(k=>'<span>'+esc(k)+'</span>').join('')+'</div>';
  h += '<h4>Closest articles by wording</h4><ul class="alist">'+a.n.map(n => artItem(n, esc(S[A[n].s].label))).join('')+'</ul>';
  return h;
}
function introPanel(){
  const n = A.filter(a => state.q ? visible(a) : false);
  if(state.q){
    let h = '<h2>Search results</h2><p class="muted" style="margin-top:0">'+n.length+' articles match \u201c'+esc(state.q)+'\u201d</p><ul class="alist">'+n.slice(0,80).map((a)=>artItem(A.indexOf(a), esc(S[a.s].label))).join('')+'</ul>';
    if(n.length > 80) h += '<p class="muted">Showing the first 80.</p>';
    return h;
  }
  return '<h2>How to read this map</h2>'
   + '<p>Every research article is placed in one main subject, and many reach into a second. Select a subject to see its articles, its recurring topics and the subjects it sits closest to. The Articles view spreads all of them out by similarity, and Over time shows how the mix has changed.</p>'
   + '<p class="note">Biggest subjects: '+S.slice().sort((a,b)=>b.n-a.n).slice(0,4).map(s=>esc(s.label)+' ('+s.n+')').join(', ')+'.</p>'
   + '<details><summary>How the subjects were assigned</summary><p>Records come from OpenAlex, not from the publisher, so the set is incomplete and uneven by year. Book reviews, notices and editorial boards are left out. Subjects were drawn up from the journal\u2019s own keywords and abstracts, assigned by a keyword-and-text model, and the third the model was least sure of was read through by hand, with about 190 articles moved to a better subject. A spot check of the rest found roughly nine in ten main subjects sensible. Volumes before about 1996 have almost no abstracts, so those articles were placed from titles and keywords alone.</p><p>Links between subjects combine three signals: articles that straddle both, articles whose wording is closest across the two, and citations between Japan Forum articles. They show where conversations overlap, not which subject is \u201cbetter\u201d.</p></details>';
}
function renderPanel(){
  let h;
  if(state.art !== null) h = articlePanel(state.art);
  else if(state.sub !== null) h = subjectPanel(state.sub);
  else h = introPanel();
  const p = $('#panel'); p.innerHTML = h; p.scrollTop = 0;
}

/* ---------- state changes ---------- */
function setSub(i){ state.sub = i; state.art = null; renderRail(); renderPanel(); renderStageKeep(); }
function setArt(j){ state.art = j; if(j !== null){ state.sub = A[j].s; } renderRail(); renderPanel(); renderStageKeep(); }
function renderStageKeep(){ if(state.view === 'time'){ applyFocus(); } else if(state.view==='network'){ applyFocus(); } else { applyFocus(); } }
function setView(v){
  state.view = v;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === v ? 'true' : 'false'));
  renderStage();
}
function renderChips(){
  const labs = ['All years'].concat(PERIODS);
  $('#pers').innerHTML = labs.map((l,i) => '<button class="chip" data-p="'+(i-1)+'" aria-pressed="'+((state.per===null && i===0) || state.per===i-1 ? 'true':'false')+'">'+l+'</button>').join('');
}
function updateCount(){
  if(!state.q && state.per === null){ $('#qcount').textContent = ''; return; }
  $('#qcount').textContent = A.filter(visible).length + ' articles shown';
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-s],[data-a],[data-p],[data-view],[data-back]');
  if(!t) return;
  if(t.dataset.view){ setView(t.dataset.view); return; }
  if(t.dataset.p !== undefined){ state.per = +t.dataset.p < 0 ? null : +t.dataset.p; renderChips(); updateCount(); applyFocus(); renderPanel(); return; }
  if(t.dataset.back !== undefined){ state.art = null; renderPanel(); applyFocus(); return; }
  if(t.dataset.a !== undefined && !t.dataset.s){ setArt(+t.dataset.a); return; }
  if(t.dataset.s !== undefined){ const i = +t.dataset.s; setSub(state.sub === i && state.art === null && !t.closest('#panel') ? null : i); }
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.node')){ e.preventDefault(); setSub(+e.target.dataset.s); }
});
let tipEl = $('#tip');
document.addEventListener('mouseover', e => {
  const n = e.target.closest('.node');
  if(n && state.view === 'network'){ applyFocus(+n.dataset.s); return; }
  const d = e.target.closest('.dot');
  if(d){ const a = A[+d.dataset.a]; tipEl.innerHTML = '<b>'+esc(a.t)+'</b><br>'+esc(a.a||'')+' · '+a.y+' · '+esc(S[a.s].label); tipEl.style.display = 'block'; }
});
document.addEventListener('mousemove', e => {
  if(tipEl.style.display === 'block'){ tipEl.style.left = Math.min(window.innerWidth-320, e.clientX + 14)+'px'; tipEl.style.top = (e.clientY + 16)+'px'; }
});
document.addEventListener('mouseout', e => {
  if(e.target.closest && e.target.closest('.node') && state.view === 'network') applyFocus();
  if(e.target.closest && e.target.closest('.dot')) tipEl.style.display = 'none';
});
$('#q').addEventListener('input', e => {
  state.q = e.target.value.trim().toLowerCase();
  updateCount(); applyFocus();
  if(state.sub === null && state.art === null) renderPanel();
  else if(state.art === null) renderPanel();
});

renderChips(); renderRail(); renderStage(); renderPanel();
</script>
</body>
</html>
